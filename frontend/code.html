<script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_BASE = 'http://127.0.0.1:8000';
        const WS_URL = 'ws://127.0.0.1:8000/api/ws/chat';
        const chatStream = document.getElementById('chat-stream');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusPill = document.getElementById('system-status');
        const inputShell = chatInput.closest('.border');
        const appState = {
            currentSessionId: window.agenthubSessionId || null,
            socket: null,
            socketReady: false,
            awaitingHuman: false,
            processing: false,
            pendingFrames: [],
            currentPreviewPath: null
        };
        let workspaceTree = null;
        let fileContent = null;
        let livePreview = null;
        let viewerShell = null;
        let runButton = null;
        let sessionList = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function setStatus(state) {
            statusPill.classList.remove('border-amber-500', 'shadow-[0_0_16px_rgba(245,158,11,0.35)]');
            if (state === 'ready') {
                statusDot.className = 'status-dot bg-green-500 animate-pulse-opacity';
                statusText.textContent = '系统就绪';
                statusText.className = 'text-[11px] font-label-caps text-green-400';
                sendButton.disabled = false;
                appState.processing = false;
                return;
            }
            if (state === 'processing') {
                statusDot.className = 'status-dot bg-yellow-500 animate-pulse-opacity';
                statusText.textContent = '智能体处理中';
                statusText.className = 'text-[11px] font-label-caps text-yellow-400';
                sendButton.disabled = true;
                appState.processing = true;
                return;
            }
            if (state === 'human') {
                statusDot.className = 'status-dot bg-amber-500 animate-pulse-opacity';
                statusText.textContent = '等待人工接管';
                statusText.className = 'text-[11px] font-label-caps text-amber-400';
                statusPill.classList.add('border-amber-500', 'shadow-[0_0_16px_rgba(245,158,11,0.35)]');
                sendButton.disabled = false;
                appState.processing = false;
                return;
            }
            statusDot.className = 'status-dot bg-red-500';
            statusText.textContent = '连接异常';
            statusText.className = 'text-[11px] font-label-caps text-red-400';
            sendButton.disabled = false;
            appState.processing = false;
        }

        function setHitlVisual(active) {
            appState.awaitingHuman = active;
            if (!inputShell) return;
            inputShell.classList.toggle('ring-2', active);
            inputShell.classList.toggle('ring-amber-500', active);
            inputShell.classList.toggle('animate-pulse', active);
        }

        function scrollToBottom() {
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function createUserMessage(text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `
                <div class="flex flex-col border-b border-gutter pb-md items-end">
                    <div class="flex items-center gap-2 mb-sm flex-row-reverse">
                        <div class="w-6 h-6 rounded bg-primary-container border border-outline-variant flex items-center justify-center text-on-primary-container"><span class="material-symbols-outlined text-[14px]">person</span></div>
                        <span class="font-bold text-on-surface">You</span>
                        <span class="text-outline-variant text-[11px]">${time}</span>
                    </div>
                    <div class="pr-8 text-right">
                        <p class="text-on-surface mb-md whitespace-pre-wrap">${escapeHtml(text)}</p>
                    </div>
                </div>
            `;
        }

        function createStepMessage(step) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const type = step.type || 'text';
            const agent = step.agent || step.sender || 'Agent';
            let content = '';
            if (type === 'flow') {
                const stages = Array.isArray(step.stages) ? step.stages : parseJson(step.content, []);
                content = `
                    <div class="border border-gutter rounded bg-[#0b0e15] p-sm relative">
                        <div class="absolute left-[23px] top-8 bottom-6 w-[1px] bg-outline-variant"></div>
                        ${stages.map((stage, index) => `
                            <div class="flex items-start gap-sm ${index < stages.length - 1 ? 'mb-sm' : ''} relative z-10">
                                <div class="w-4 h-4 rounded-full border ${stage.status === 'active' ? 'border-tech-blue bg-surface' : 'border-outline-variant bg-surface'} flex mt-1 flex-shrink-0 items-center justify-center">
                                    ${stage.status === 'active' ? '<div class="w-1.5 h-1.5 rounded-full bg-tech-blue"></div>' : ''}
                                </div>
                                <div>
                                    <span class="font-label-caps text-label-caps ${stage.status === 'active' ? 'text-tech-blue' : 'text-on-surface-variant'} block">${escapeHtml(stage.title)}</span>
                                    <span class="text-outline-variant text-[12px]">${escapeHtml(stage.description)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (type === 'code_diff') {
                content = `
                    <div class="border border-gutter rounded bg-[#0b0e15] p-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-mono-code text-on-surface-variant text-[12px]">${escapeHtml(step.filename || 'code')}</span>
                            <span class="px-2 py-1 bg-surface-container text-on-surface rounded text-[11px] border border-outline-variant">Artifact</span>
                        </div>
                        <pre class="font-mono-code text-[12px] text-on-surface bg-[#05070a] p-2 rounded overflow-x-auto border border-gutter"><code>${step.content || escapeHtml(step.artifact_code || '')}</code></pre>
                    </div>
                `;
            } else if (type === 'review') {
                const review = parseJson(step.content, null);
                const passed = step.passed ?? review?.passed;
                const summary = review?.summary || step.content || '';
                content = `
                    <div class="border ${passed ? 'border-green-700 bg-[#07140d] text-green-300' : 'border-amber-700 bg-[#1f1605] text-amber-300'} rounded p-sm text-[13px] whitespace-pre-wrap">${escapeHtml(summary)}</div>
                `;
            } else if (type === 'stdout' || type === 'stderr' || type === 'run') {
                content = `
                    <pre class="font-mono-code text-[12px] ${type === 'stderr' ? 'text-red-300 border-red-900 bg-[#1f0808]' : 'text-green-300 border-green-900 bg-[#06140c]'} p-2 rounded overflow-x-auto border">${escapeHtml(step.content || '')}</pre>
                `;
            } else if (type === 'run.requires_human') {
                content = `
                    <div class="border border-amber-600 rounded bg-[#211604] p-sm text-amber-300 text-[13px] whitespace-pre-wrap">${escapeHtml(step.content || '')}</div>
                `;
            } else if (type === 'thought') {
                content = `<p class="text-cyan-300 mb-md whitespace-pre-wrap">${escapeHtml(step.content || '')}</p>`;
            } else {
                content = `<p class="text-on-surface-variant mb-md whitespace-pre-wrap">${escapeHtml(step.content || '')}</p>`;
            }
            return `
                <div class="flex flex-col border-b border-gutter pb-md">
                    <div class="flex items-center gap-2 mb-sm">
                        <div class="w-6 h-6 rounded bg-surface-variant border border-outline-variant flex items-center justify-center text-outline"><span class="material-symbols-outlined text-[14px]">smart_toy</span></div>
                        <span class="font-bold text-on-surface">${escapeHtml(agent)}</span>
                        <span class="text-outline-variant text-[11px]">${time}</span>
                    </div>
                    <div class="pl-8">${content}</div>
                </div>
            `;
        }

        function createSkeleton() {
            return `
                <div id="skeleton-message" class="flex flex-col border-b border-gutter pb-md animate-pulse">
                    <div class="flex items-center gap-2 mb-sm">
                        <div class="w-6 h-6 rounded bg-surface-variant border border-outline-variant"></div>
                        <div class="h-4 bg-surface-variant rounded w-20"></div>
                    </div>
                    <div class="pl-8">
                        <div class="h-4 bg-surface-variant rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-surface-variant rounded w-1/2"></div>
                    </div>
                </div>
            `;
        }

        function removeSkeleton() {
            const node = document.getElementById('skeleton-message');
            if (node) node.remove();
        }

        function parseJson(value, fallback) {
            try {
                return JSON.parse(value);
            } catch {
                return fallback;
            }
        }

        function ensureSocket() {
            if (appState.socket && appState.socket.readyState <= 1) return;
            const socket = new WebSocket(WS_URL);
            appState.socket = socket;
            appState.socketReady = false;
            socket.onopen = () => {
                appState.socketReady = true;
                const frames = appState.pendingFrames.splice(0);
                frames.forEach(frame => socket.send(JSON.stringify(frame)));
                setStatus(appState.awaitingHuman ? 'human' : 'ready');
            };
            socket.onmessage = event => handleFrame(JSON.parse(event.data));
            socket.onerror = () => setStatus('error');
            socket.onclose = () => {
                appState.socketReady = false;
                if (!appState.awaitingHuman) setStatus('error');
                setTimeout(ensureSocket, 1500);
            };
        }

        function sendFrame(frame) {
            const payload = { ...frame, session_id: appState.currentSessionId };
            ensureSocket();
            if (appState.socketReady && appState.socket) {
                appState.socket.send(JSON.stringify(payload));
                return;
            }
            appState.pendingFrames.push(payload);
        }

        function renderStep(step) {
            if (step.role === 'user' || step.sender === 'User' || step.agent === 'User') {
                chatStream.insertAdjacentHTML('beforeend', createUserMessage(step.content || ''));
            } else {
                chatStream.insertAdjacentHTML('beforeend', createStepMessage(step));
            }
            scrollToBottom();
        }

        function handleFrame(step) {
            if (step.type === 'session') {
                appState.currentSessionId = step.session_id;
                window.agenthubSessionId = step.session_id;
                loadSessions();
                loadFileTree();
                return;
            }
            const frameSessionId = Number(step.session_id || appState.currentSessionId || 0);
            if (appState.currentSessionId && frameSessionId && frameSessionId !== Number(appState.currentSessionId)) return;
            if (step.type === 'done') {
                removeSkeleton();
                setHitlVisual(false);
                setStatus('ready');
                loadSessions();
                loadFileTree();
                return;
            }
            removeSkeleton();
            if (step.type === 'run.requires_human') {
                setHitlVisual(true);
                setStatus('human');
            } else if (!appState.awaitingHuman) {
                setStatus('processing');
            }
            renderStep(step);
            if (step.type === 'code_diff') {
                loadFileTree();
                const filename = step.filename || '';
                if (filename.endsWith('.html')) reloadPreview(filename);
            }
        }

        async function loadSessions() {
            const response = await fetch(`${API_BASE}/api/sessions`);
            const sessions = await response.json();
            if (!sessionList) return;
            sessionList.innerHTML = sessions.length ? sessions.map(session => sessionItem(session)).join('') : emptySessions();
            sessionList.querySelectorAll('[data-session-id]').forEach(node => {
                node.addEventListener('click', () => switchSession(Number(node.dataset.sessionId)));
            });
            if (!appState.currentSessionId && sessions[0]) {
                await switchSession(sessions[0].id);
            }
        }

        function sessionItem(session) {
            const active = Number(appState.currentSessionId) === Number(session.id);
            return `
                <div data-session-id="${session.id}" class="flex items-center p-md rounded border ${active ? 'border-tech-blue bg-secondary-panel shadow-[0_0_8px_rgba(59,130,246,0.2)]' : 'border-transparent hover:border-gutter hover:bg-surface-container'} mb-xs cursor-pointer transition-colors">
                    <div class="w-10 h-10 rounded bg-surface-variant border border-gutter flex items-center justify-center text-outline mr-sm flex-shrink-0">
                        <span class="material-symbols-outlined">hub</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-xs">
                            <h3 class="font-bold ${active ? 'text-on-surface' : 'text-on-surface-variant'} truncate">${escapeHtml(session.title || `Session ${session.id}`)}</h3>
                            <span class="text-[10px] text-outline-variant">#${session.id}</span>
                        </div>
                        <p class="text-outline-variant truncate text-[12px]">持久化会话已就绪</p>
                    </div>
                </div>
            `;
        }

        function emptySessions() {
            return '<div class="p-md text-outline-variant text-[12px]">发送第一条消息后创建会话</div>';
        }

        async function switchSession(sessionId) {
            appState.currentSessionId = sessionId;
            window.agenthubSessionId = sessionId;
            chatStream.innerHTML = '';
            setHitlVisual(false);
            setStatus('ready');
            const response = await fetch(`${API_BASE}/api/messages/${sessionId}`);
            const messages = await response.json();
            messages.forEach(renderStep);
            await loadFileTree();
            if (sessionList) {
                sessionList.querySelectorAll('[data-session-id]').forEach(node => {
                    const active = Number(node.dataset.sessionId) === Number(sessionId);
                    node.classList.toggle('border-tech-blue', active);
                    node.classList.toggle('bg-secondary-panel', active);
                    node.classList.toggle('border-transparent', !active);
                });
            }
        }

        function setupSessionList() {
            const aside = document.querySelector('aside');
            sessionList = aside?.querySelector('.flex-1.overflow-y-auto');
            if (sessionList) sessionList.innerHTML = emptySessions();
        }

        function setupWorkspacePanel() {
            const root = document.querySelector('body > div.flex');
            const panel = document.createElement('aside');
            panel.id = 'workspace-panel';
            panel.className = 'w-[480px] flex-shrink-0 bg-surface-container-lowest border-l border-gutter h-full flex flex-col';
            panel.innerHTML = `
                <div class="h-14 border-b border-gutter px-md flex items-center justify-between">
                    <div>
                        <h2 class="font-bold text-on-surface">Workspace</h2>
                        <p class="text-outline-variant text-[11px]">files · runner · iframe</p>
                    </div>
                    <button id="run-button" class="px-3 py-1.5 bg-tech-blue text-on-primary rounded font-bold hover:bg-primary-container transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">play_arrow</span>Run
                    </button>
                </div>
                <div class="grid grid-cols-[160px_1fr] min-h-0 flex-1">
                    <div class="border-r border-gutter overflow-y-auto scrollbar-hide p-sm" id="workspace-tree"></div>
                    <div class="min-w-0 min-h-0 flex flex-col">
                        <div id="viewer-shell" class="grid grid-cols-1 min-h-0 flex-1">
                            <pre id="file-content" class="font-mono-code text-[12px] text-on-surface bg-[#05070a] p-sm overflow-auto whitespace-pre-wrap border-0"></pre>
                            <iframe id="live-preview" class="hidden w-full h-full bg-white border-l border-gutter"></iframe>
                        </div>
                    </div>
                </div>
            `;
            root.appendChild(panel);
            workspaceTree = document.getElementById('workspace-tree');
            fileContent = document.getElementById('file-content');
            livePreview = document.getElementById('live-preview');
            viewerShell = document.getElementById('viewer-shell');
            runButton = document.getElementById('run-button');
            runButton.addEventListener('click', runWorkspace);
        }

        async function loadFileTree() {
            if (!appState.currentSessionId || !workspaceTree) return;
            const response = await fetch(`${API_BASE}/api/workspace/${appState.currentSessionId}/files`);
            const tree = await response.json();
            workspaceTree.innerHTML = renderTree(tree);
            workspaceTree.querySelectorAll('[data-file-path]').forEach(node => {
                node.addEventListener('click', () => openFile(node.dataset.filePath));
            });
        }

        function renderTree(nodes, depth = 0) {
            return nodes.map(node => {
                const padding = depth * 12;
                if (node.type === 'directory') {
                    return `
                        <div class="mb-1">
                            <div class="text-outline-variant text-[12px] font-bold py-1" style="padding-left:${padding}px">
                                <span class="material-symbols-outlined text-[14px] align-[-2px]">folder</span>${escapeHtml(node.name)}
                            </div>
                            ${renderTree(node.children || [], depth + 1)}
                        </div>
                    `;
                }
                return `
                    <button data-file-path="${escapeHtml(node.path)}" class="w-full text-left text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded px-1 py-1 text-[12px] truncate" style="padding-left:${padding + 16}px">
                        <span class="material-symbols-outlined text-[14px] align-[-2px]">description</span>${escapeHtml(node.name)}
                    </button>
                `;
            }).join('');
        }

        async function openFile(path) {
            if (!appState.currentSessionId || !path) return;
            const response = await fetch(`${API_BASE}/api/workspace/${appState.currentSessionId}/file?path=${encodeURIComponent(path)}`);
            const file = await response.json();
            fileContent.textContent = file.content || '';
            if (path.endsWith('.html')) {
                appState.currentPreviewPath = path;
                viewerShell.className = 'grid grid-cols-2 min-h-0 flex-1';
                livePreview.classList.remove('hidden');
                livePreview.src = previewUrl(path);
                return;
            }
            appState.currentPreviewPath = null;
            viewerShell.className = 'grid grid-cols-1 min-h-0 flex-1';
            livePreview.classList.add('hidden');
        }

        function previewUrl(path) {
            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            return `${API_BASE}/workspaces/session_${appState.currentSessionId}/${encodedPath}?t=${Date.now()}`;
        }

        function reloadPreview(path) {
            const target = path || appState.currentPreviewPath;
            if (!target || !target.endsWith('.html')) return;
            appState.currentPreviewPath = target;
            viewerShell.className = 'grid grid-cols-2 min-h-0 flex-1';
            livePreview.classList.remove('hidden');
            setTimeout(() => {
                livePreview.src = previewUrl(target);
            }, 200);
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            renderStep({ sender: 'User', content: text });
            if (appState.awaitingHuman) {
                setHitlVisual(false);
                setStatus('processing');
                sendFrame({ type: 'human_feedback', content: text });
                chatStream.insertAdjacentHTML('beforeend', createSkeleton());
                scrollToBottom();
                return;
            }
            if (appState.processing) return;
            setStatus('processing');
            chatStream.insertAdjacentHTML('beforeend', createSkeleton());
            scrollToBottom();
            sendFrame({ type: 'message', content: text });
        }

        function runWorkspace() {
            if (!appState.currentSessionId) return;
            setStatus('processing');
            sendFrame({ action: 'run' });
        }

        window.switchSession = switchSession;
        setupSessionList();
        setupWorkspacePanel();
        ensureSocket();
        loadSessions();
        setStatus('ready');
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    });
</script>
</body></html>
